name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENABLE_ENGLISH: "false"
      # Interim admin login for the e2e tests (architecture.md §6).
      ADMIN_SECRET: ci-only-admin-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Convex tests
        run: pnpm test:convex

      - name: Start a local Convex backend
        # Anonymous local backend, no account needed. `convex dev` writes the
        # deployment and NEXT_PUBLIC_CONVEX_URL to .env.local, which the build
        # and the e2e fixtures read.
        run: |
          CONVEX_AGENT_MODE=anonymous npx convex dev --tail-logs disable > convex-dev.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Convex functions ready" convex-dev.log && break
            sleep 2
          done
          grep -q "Convex functions ready" convex-dev.log || { cat convex-dev.log; exit 1; }
          npx convex env set ADMIN_SECRET "$ADMIN_SECRET"

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
