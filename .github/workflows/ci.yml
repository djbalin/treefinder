name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: treefinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/treefinder
      PAYLOAD_SECRET: ci-only-secret
      ENABLE_ENGLISH: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Convex tests
        run: pnpm test:convex

      - name: Migrate database
        run: pnpm migrate

      - name: Check migrations match the collections
        run: |
          pnpm payload migrate:create schema-check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "Collections changed without a migration. Run: pnpm migrate:create <name>"
            git status --porcelain src/migrations
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:int

      - name: Start a local Convex backend
        # Anonymous local backend, no account needed. `convex dev` writes the
        # deployment and NEXT_PUBLIC_CONVEX_URL to .env.local, which the build
        # and the e2e fixtures read.
        run: |
          CONVEX_AGENT_MODE=anonymous npx convex dev --tail-logs disable > convex-dev.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Convex functions ready" convex-dev.log && break
            sleep 2
          done
          grep -q "Convex functions ready" convex-dev.log || { cat convex-dev.log; exit 1; }

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
